name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 8-File Contract + v2 architecture validator
        run: python tools/validate_project.py

      - name: Structural & content validator
        run: python tools/run_test_scenarios.py --all

      - name: Knowledge-updater unit tests
        run: python tools/test_knowledge_updater.py

      - name: Engine unit + integration tests
        run: python -m unittest discover -s tests/engine -p "test_*.py"

      - name: Setup + smoke test
        run: python scripts/setup_env.py
