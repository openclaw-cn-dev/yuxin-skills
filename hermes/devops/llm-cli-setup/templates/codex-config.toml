# ============================================================
# 常见错(全是 0.42 真踩过的)
# ============================================================
# | 现象 | 修法 |
# |---|---|
# | `invalid type: map, expected a string in 'model'` | 顶层 model 必须是字符串,不能写 [model] name="..." 子表 |
# | `unknown variant 'openai-chat', expected 'responses'` | wire_api 写错,0.42 用 "chat",0.138+ 才用 "responses" |
# | `wire_api = "chat" is no longer supported` | 装错版本,降到 @openai/codex@0.42.0 |
# | `401 Unauthorized` | env 没设 / 还没新开 cmd / key 错 |
# | `404 Not Found` | base_url 末尾漏 /v1,或模型名拼错 |
# | `model not found` | 用本地叫法当 API 名传了,去控制台"模型广场"查真实名 |
# | CLI 起来一堆 `ERROR codex_core::mcp_connection_manager` | GUI 段残留,不影响 API 调用,忽略 |
